<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Buscador de Instituições Financeiras</title>
    <meta name="data-atualizacao" content="20/10/2026, 14:39">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:    #07080B;
            --bg2:   #0D0F14;
            --bg3:   #12151C;
            --border:#2a2e3f;
            --text:  #F5F6F8;
            --text2: #9CA1AC;
            --text3: #767C8A;
            --gold:  #f5c842;
            --amber: #e0ac2c;
            --green: #2ecc71;
            --red:   #e74c3c;
            --blue:  #4a9eff;
        }
        body.light {
            --bg:    #f4f5f7;
            --bg2:   #ffffff;
            --bg3:   #eef0f4;
            --border:#d4d8e2;
            --text:  #1a1d2e;
            --text2: #4a4f6a;
            --text3: #8a90a8;
            --gold:  #b8860b;
            --amber: #c47d00;
            --green: #1a8a4a;
            --red:   #c0392b;
            --blue:  #1565c0;
        }

        /* ==================== TOPBAR PADRÃO HUB FINANCEIRO ==================== */
        .hub-topbar {
            --bg-topbar: #141720;
            --border-topbar: #2a2e3f;
            --text-topbar: #e1e3ef;
            --text2-topbar: #9a9eb8;
            --text3-topbar: #5c6080;
            --gold-topbar: #f5c842;
            --amber-topbar: #e0ac2c;
            font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
            background: rgba(20,23,32,.3);
            border-bottom: 1px solid rgba(255,255,255,.14);
            box-shadow: 0 4px 16px -8px rgba(0,0,0,0.4), inset 0 -1px 0 rgba(255,255,255,.05);
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 200;
            backdrop-filter: blur(8px) saturate(200%);
            -webkit-backdrop-filter: blur(8px) saturate(200%);
        }
        body.light .hub-topbar {
            --bg-topbar: #ffffff;
            --border-topbar: #d4d8e2;
            --text-topbar: #1a1d2e;
            --text2-topbar: #4a4f6a;
            --text3-topbar: #8a90a8;
            --gold-topbar: #b8860b;
            --amber-topbar: #c47d00;
            background: #ffffff;
            border-bottom: 1px solid #d4d8e2;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .hub-topbar-left, .hub-topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .hub-topbar-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            pointer-events: none;
        }
        .hub-pbf-badge {
            background: var(--gold-topbar);
            padding: 0 12px;
            height: 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 800;
            color: #000;
            letter-spacing: 0.5px;
        }
        .hub-topbar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-topbar);
            white-space: nowrap;
        }
        .hub-back-btn, .hub-newtab-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: 1px solid var(--border-topbar);
            border-radius: 8px;
            color: var(--text2-topbar);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 10px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .hub-back-btn:hover, .hub-newtab-btn:hover {
            border-color: var(--amber-topbar);
            color: var(--gold-topbar);
            background: var(--bg-topbar);
        }
        .hub-active-tool {
            font-size: 15px;
            font-weight: 700;
            color: var(--gold-topbar);
            white-space: nowrap;
            background: transparent;
        }
        .hub-clock {
            font-size: 11px;
            color: var(--text3-topbar);
            font-variant-numeric: tabular-nums;
            background: var(--bg-topbar);
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid var(--border-topbar);
        }
        .hub-theme-btn {
            background: var(--border-topbar);
            border: 1px solid var(--border-topbar);
            border-radius: 11px;
            width: 46px;
            height: 22px;
            position: relative;
            cursor: pointer;
            transition: background 0.25s, border-color 0.2s;
            flex-shrink: 0;
            padding: 0;
        }
        .hub-theme-btn:hover {
            border-color: var(--gold-topbar);
        }
        .hub-theme-btn .hub-theme-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--text2-topbar);
            transition: left 0.25s, background 0.25s;
        }
        body.light .hub-theme-btn {
            background: rgba(184, 134, 11, 0.3);
        }
        body.light .hub-theme-btn .hub-theme-knob {
            left: 26px;
            background: var(--gold-topbar);
        }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @media (max-width: 600px) {
            .hub-back-btn, .hub-newtab-btn {
                padding: 5px 8px;
                font-size: 11px;
            }
            .hub-active-tool {
                font-size: 13px;
                max-width: 140px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hub-clock {
                font-size: 10px;
                padding: 4px 6px;
            }
            .hub-theme-btn {
                width: 40px;
                height: 20px;
            }
            .hub-theme-btn .hub-theme-knob {
                width: 16px;
                height: 16px;
            }
            body.light .hub-theme-btn .hub-theme-knob {
                left: 22px;
            }
        }
        @media (max-width: 480px) {
            .hub-topbar-title {
                display: none;
            }
            .hub-topbar-center {
                position: static;
                transform: none;
                margin: 0 auto;
            }
        }
        /* ==================== FIM TOPBAR ==================== */

        /* Estilos originais da página (ajustados para ocupar 100% da largura) */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); font-family: "DM Sans", sans-serif; color: var(--text); padding: 0; min-height: 100vh; transition: background .2s, color .2s; }
        .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

        /* ── Header ── */
        .page-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:6px; }
        .page-title { font-size:1.5rem; font-weight:700; color:var(--gold); letter-spacing:-.02em; }
        .page-subtitle { font-size:.8rem; color:var(--text3); padding-left:14px; border-left:3px solid var(--amber); margin-bottom:20px; }
        #dataAtualizacao { margin-left:8px; font-size:.75rem; color:var(--text3); }

        /* ── Cards ── */
        .card { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:22px 24px; margin-bottom:20px; }
        .card-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
        .card-title span { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--text3); }

        /* ── Stats bar ── */
        .stats-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
        .stat-pill { display:inline-flex; align-items:center; gap:0; background:var(--bg3); border:1px solid var(--border); border-radius:20px; overflow:hidden; font-size:11px; font-weight:600; color:var(--text2); padding-right:14px; cursor:pointer; transition:all .18s; user-select:none; }
        .stat-pill:hover { border-color:var(--amber); color:var(--text); }
        .stat-pill.active-all  { background:rgba(245,200,66,.12); border-color:var(--gold); color:var(--gold); }
        .stat-pill.active-a    { background:rgba(46,204,113,.12); border-color:var(--green); color:var(--green); }
        .stat-pill.active-b    { background:rgba(74,159,255,.12); border-color:var(--blue);  color:var(--blue); }
        .stat-pill.active-c    { background:rgba(224,172,44,.12); border-color:var(--amber); color:var(--amber); }
        .stat-pill.active-d    { background:rgba(231,76,60,.12);  border-color:var(--red);   color:var(--red); }
        .stat-pill .dot { width:4px; align-self:stretch; flex:0 0 4px; display:block; margin-right:10px; }
        .dot-gold  { background:var(--gold); }
        .dot-green { background:var(--green); }
        .dot-red   { background:var(--red); }
        .dot-blue  { background:var(--blue); }
        .dot-amber { background:var(--amber); }

        /* ── Search ── */
        .search-wrap { position:relative; }
        .search-wrap label { display:block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text3); margin-bottom:8px; }
        .search-inner { position:relative; }
        .search-inner input {
            width:100%; background:var(--bg3); border:1px solid var(--border);
            padding:11px 40px 11px 16px; border-radius:40px;
            color:var(--text); font-size:.9rem; font-family:inherit;
            transition:border-color .2s;
        }
        .search-inner input:focus { outline:none; border-color:var(--amber); }
        .search-inner input::placeholder { color:var(--text3); }
        .clear-btn {
            position:absolute; right:12px; top:50%; transform:translateY(-50%);
            background:none; border:none; color:var(--text3); cursor:pointer;
            font-size:1rem; padding:4px; display:none; align-items:center;
            justify-content:center; border-radius:50%; transition:.2s;
        }
        .clear-btn:hover { color:var(--gold); background:var(--border); }
        .autocomplete-items {
            position:absolute; top:calc(100% + 6px); left:0; right:0;
            background:var(--bg2); border:1px solid var(--border); border-radius:14px;
            max-height:280px; overflow-y:auto; z-index:100;
            box-shadow:0 8px 24px rgba(0,0,0,.5);
        }
        .autocomplete-item {
            padding:10px 16px; cursor:pointer;
            border-bottom:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center;
            gap:12px; transition:background .1s;
        }
        .autocomplete-item:last-child { border-bottom:none; }
        .autocomplete-item span:first-child { flex:1; font-size:.85rem; color:var(--text); line-height:1.4; }
        .autocomplete-item:hover, .autocomplete-item.active { background:var(--bg3); }
        .autocomplete-item.active { border-left:3px solid var(--amber); }

        /* ── Rating badges ── */
        .rating-badge { font-size:.68rem; padding:3px 10px; border-radius:20px; font-weight:700; white-space:nowrap; }
        .rating-green { background:rgba(46,204,113,.12); color:var(--green); border:1px solid rgba(46,204,113,.3); }
        .rating-red   { background:rgba(231,76,60,.12);  color:var(--red);   border:1px solid rgba(231,76,60,.3); }
        .rating-neutral { background:var(--bg3); color:var(--text3); border:1px solid var(--border); }

        /* ── Result card ── */
        .inst-card { }
        .inst-header {
            display:flex; align-items:center; flex-wrap:wrap; gap:12px;
            padding-bottom:16px; margin-bottom:18px;
            border-bottom:1px solid var(--border);
        }
        .inst-icon {
            width:44px; height:44px; border-radius:12px;
            background:rgba(245,200,66,.08); border:1px solid rgba(245,200,66,.2);
            display:flex; align-items:center; justify-content:center;
            font-size:20px; flex-shrink:0;
        }
        .inst-name { font-size:1.15rem; font-weight:700; color:var(--gold); }
        .score-pill {
            margin-left:auto; display:inline-flex; align-items:center; gap:6px;
            background:rgba(245,200,66,.08); border:1px solid rgba(245,200,66,.2);
            border-radius:20px; padding:5px 14px;
            font-size:.8rem; font-weight:700; color:var(--gold);
        }
        .score-pill span { font-size:.7rem; font-weight:400; color:var(--text3); }
        .info-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px;
        }
        .info-item {
            background:var(--bg3); border:1px solid var(--border);
            border-radius:12px; padding:12px 16px;
        }
        .info-label { font-size:.68rem; text-transform:uppercase; letter-spacing:.8px; color:var(--text3); font-weight:700; }
        .info-value { font-size:1rem; font-weight:700; color:var(--amber); margin-top:5px; word-break:break-word; }
        .info-item.highlight { border-color:rgba(245,200,66,.25); }
        .info-item.highlight .info-value { color:var(--gold); }

        /* ── Admin button ── */
        .admin-btn {
            background:var(--bg3); border:1px solid var(--border);
            padding:8px 18px; border-radius:30px; color:var(--text2);
            font-size:.78rem; font-weight:600; cursor:pointer;
            font-family:inherit; transition:.2s; white-space:nowrap;
        }
        .admin-btn:hover { border-color:var(--amber); color:var(--gold); }

        /* ── Modal ── */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.75); z-index:1000; justify-content:center; align-items:center; }
        .modal-content {
            background:rgba(20,23,32,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,.1);
            box-shadow: 0 30px 70px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
            border-radius:20px; padding:28px; width:90%; max-width:400px;
        }
        .modal-content h3 { font-size:1rem; font-weight:700; color:var(--gold); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .modal-content input[type=password] {
            width:100%; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1);
            padding:10px 16px; border-radius:30px; color:var(--text);
            font-family:inherit; font-size:.9rem; margin:12px 0;
        }
        .modal-content input[type=password]:focus { outline:none; border-color:rgba(255,255,255,.25); }
        .upload-area-sm {
            border:1px dashed var(--border); border-radius:12px;
            padding:16px; text-align:center; margin-top:12px; cursor:pointer;
            color:var(--text3); font-size:.85rem; transition:border-color .2s;
        }
        .upload-area-sm:hover { border-color:var(--amber); color:var(--text2); }
        .upload-area-sm input[type=file] { display:none; }
        .flex-btns { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
        .btn {
            background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
            padding:8px 20px; border-radius:30px; color:var(--text2);
            font-family:inherit; font-size:.82rem; cursor:pointer; transition:.2s;
        }
        .btn:hover { border-color:var(--amber); color:var(--gold); }

        /* ── Empty / footer ── */
        .empty-msg { text-align:center; padding:40px; color:var(--text3); font-size:.9rem; }
        footer { text-align:center; font-size:.7rem; color:var(--text3); margin-top:16px; }

        @media (max-width:640px) { body { padding:0; } .inst-name { font-size:1rem; } .container { padding: 20px 16px; } }
    
        /* ── Ver todos ── */
        .btn-ver-todos {
            background:rgba(74,158,255,.1); border:1px solid rgba(74,158,255,.35);
            color:var(--blue); padding:8px 18px; border-radius:10px;
            font-family:inherit; font-size:.78rem; font-weight:600;
            cursor:pointer; transition:all .2s; white-space:nowrap;
        }
        .btn-ver-todos:hover { background:rgba(74,158,255,.18); border-color:var(--blue); }
        .btn-ver-todos.active { background:rgba(74,158,255,.18); border-color:var(--blue); }
        .fundos-list-card { animation: fadeSlideIn .22s ease; }
        .fundos-list-header { display:flex; align-items:center; justify-content:space-between; padding-bottom:14px; margin-bottom:4px; border-bottom:1px solid var(--border); }
        .fundos-list-header h2 { font-size:.95rem; font-weight:700; color:var(--text); }
        .fundo-item-arrow { font-size:.7rem; color:var(--text3); flex-shrink:0; transition:transform .2s; margin-left:4px; }
        .fundo-item-wrap.open .fundo-item-arrow { transform:rotate(180deg); }
        .fundo-detail-panel { display:none; padding:12px 12px 14px; border-top:1px solid var(--border); background:var(--bg3); border-radius:0 0 10px 10px; }
        .fundo-detail-panel.open { display:block; animation: fadeSlideIn .18s ease; }
        .fundo-detail-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
        .fundo-detail-item { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; }
        .fundo-detail-label { font-size:.65rem; text-transform:uppercase; letter-spacing:.8px; color:var(--text3); font-weight:700; }
        .fundo-detail-value { font-size:.85rem; font-weight:700; color:var(--amber); margin-top:3px; }
        .fundo-item-wrap { border:1px solid var(--border); border-radius:10px; margin-bottom:4px; overflow:hidden; transition:border-color .15s; }
        .fundo-item-wrap:hover { border-color:rgba(74,158,255,.3); }
        .fundo-item-wrap.open { border-color:rgba(74,158,255,.4); }
        .fundo-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; cursor:pointer; transition:background .15s; }
        .fundo-item:hover { background:var(--bg3); }
        .fundo-item-name { font-size:.82rem; font-weight:600; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .fundo-item-meta { display:flex; gap:6px; align-items:center; flex-shrink:0; }
        .fundo-item-cat { font-size:.68rem; color:var(--text3); white-space:nowrap; }
    </style>
</head>
<body>

<!-- ==================== TOPBAR PADRÃO HUB FINANCEIRO ==================== -->
<div class="hub-topbar">
    <div class="hub-topbar-left">
        <div class="hub-pbf-badge">PBF</div>
        <span class="hub-topbar-title">Hub Financeiro</span>
        <button class="hub-back-btn" id="hubBackBtn">
            <span>Voltar ao início</span>
        </button>
    </div>
    <div class="hub-topbar-center">
        <span id="hubActiveToolName" class="hub-active-tool">Rating — Emissores Bancários</span>
    </div>
    <div class="hub-topbar-right">
        <button class="hub-newtab-btn" id="hubNewTabBtn">
            <span>Nova aba</span>
        </button>
        <span class="hub-clock" id="hubClock"></span>
        <button class="hub-theme-btn" id="hubThemeBtn" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
            <div class="hub-theme-knob"></div>
        </button>
    </div>
</div>
<!-- ==================== FIM TOPBAR ==================== -->

<div class="container">

    <!-- Search card -->
    <div class="card">
        <div class="page-header">
            <div>
                <div class="page-title">Rating — Instituições Financeiras</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <button class="btn-ver-todos" id="verTodosBtn">Ver todos</button>
                <button class="admin-btn" id="adminBtn">Atualizar base</button>
            </div>
        </div>
        <div class="page-subtitle">Consulte instituições financeiras — dados fixos na última versão publicada<span id="dataAtualizacao"></span></div>

        <div id="statsBar" class="stats-bar"></div>

        <div class="search-wrap">
            <label>Digite o nome da instituição (mínimo 2 letras)<span id="filterLabel" style="margin-left:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;"></span></label>
            <div class="search-inner">
                <form onsubmit="return false;" autocomplete="off">
                    <input type="hidden" name="dummy" value="prevent-pwd-manager">
                    <input type="text" id="searchInput" autocomplete="off" autocorrect="off"
                           autocapitalize="off" spellcheck="false"
                           placeholder="Ex: BRADESCO, ITAU, PICPAY, BTG...">
                    <button class="clear-btn" id="clearSearchBtn" type="button" title="Limpar">✖</button>
                </form>
                <div id="autocompleteList" class="autocomplete-items" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- Result -->
    <div id="listArea" style="display:none;">
        <div class="card fundos-list-card" id="listCard"></div>
    </div>

    <div id="resultArea" style="display:none;">
        <div class="card" id="resultCard"></div>
    </div>

    <footer>Dados embutidos nesta versão. Atualização apenas pelo administrador.</footer>
</div>

<!-- Admin modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Atualização de dados</h3>
        <form onsubmit="return false;" autocomplete="off">
            <input type="password" id="adminPassword" placeholder="Senha de administrador" autocomplete="new-password">

    let instMap = new Map();
    let activeRatingFilter = 'all'; // 'all' | 'a' | 'b' | 'c' | 'd'
    let searchInput, autocompleteDiv, clearBtn, currentFocus = -1;
    function matchesRatingFilter(inst) {
        if (activeRatingFilter === 'all') return true;
        return !!(inst.Rating && inst.Rating.toString().toUpperCase().startsWith(activeRatingFilter.toUpperCase()));
    }
        function getRatingColorClass(rating) {
        if (!rating) return 'rating-neutral';
        const r = rating.toString().toUpperCase();
        if (r.startsWith('A')) return 'rating-green';
        if (r.startsWith('B') || r.startsWith('C') || r.startsWith('D') || r === 'CCC' || r === 'CC' || r === 'C' || r === 'D') return 'rating-red';
        return 'rating-neutral';
    }
    function formatPercent(value) {
        if (value === undefined || value === null || value === '') return '—';
        let num = parseFloat(value);
        if (isNaN(num)) return value.toString();
        return (num * 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
    }
    function formatNumber(value) {
        if (value === undefined || value === null || value === '') return '—';
        let num = parseFloat(value);
        if (isNaN(num)) return value.toString();
        return num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    function renderDetalhes(inst) {
        const resultCard = document.getElementById('resultCard');
        if (!inst) {
            resultCard.innerHTML = '<div class="empty-msg">Selecione uma instituição para ver os detalhes.</div>';
            document.getElementById('resultArea').style.display = 'block';
            return;
        }
        const ratingClass = getRatingColorClass(inst['Rating']);
        const ratingHtml = inst['Rating'] ? `<span class="rating-badge ${ratingClass}">${escapeHtml(inst['Rating'])}</span>` : '';
        const scoreVal = inst['Score Final'];
        const scoreFmt = scoreVal !== undefined && scoreVal !== null ? formatNumber(scoreVal) : null;
        const campos = [
            { label: 'Segmento', key: 'Seg', format: v => v, highlight: false },
            { label: 'Peso Sugerido', key: 'Peso Sug.', format: formatPercent, highlight: true },
            { label: 'Basileia', key: 'Basileia', format: formatPercent, highlight: false },
            { label: 'NPL (15d)', key: 'NPL (15d)', format: formatPercent, highlight: false },
            { label: 'ROE', key: 'ROE', format: formatPercent, highlight: false },
            { label: 'LDR', key: 'LDR', format: formatPercent, highlight: false },
            { label: 'IRBB/PR', key: 'IRBB/PR', format: formatPercent, highlight: false }
        ];
        let gridHtml = '';
        for (let campo of campos) {
            let valor = inst[campo.key];
            if (valor !== undefined && valor !== null && valor !== '') {
                let vf = campo.format(valor);
                gridHtml += `<div class="info-item${campo.highlight ? ' highlight' : ''}"><div class="info-label">${campo.label}</div><div class="info-value">${escapeHtml(vf.toString())}</div></div>`;
            }
        }
        let html = `
        <div class="inst-card">
            <div class="inst-header">
                <div>
                    <div class="inst-name">${escapeHtml(inst['Instituição'])}</div>
                    <div style="margin-top:5px;">${ratingHtml}</div>
                </div>
                ${scoreFmt ? `<div class="score-pill">Score <span>&nbsp;</span>${scoreFmt}</div>` : ''}
            </div>
            <div class="info-grid">${gridHtml}</div>
        </div>`;
        resultCard.innerHTML = html;
        document.getElementById('resultArea').style.display = 'block';
    }

        const countB = instituicoes.filter(i => i.Rating && i.Rating.toString().toUpperCase().startsWith('B')).length;
        const countC = instituicoes.filter(i => i.Rating && i.Rating.toString().toUpperCase().startsWith('C')).length;
        const countD = instituicoes.filter(i => i.Rating && i.Rating.toString().toUpperCase().startsWith('D')).length;
        statsDiv.innerHTML = `
            <div class="stat-pill ${activeRatingFilter==='all'?'active-all':''}" data-filter="all" title="Ver todas as instituições"><span class="dot dot-gold"></span>${instituicoes.length} instituições</div>
            <div class="stat-pill ${activeRatingFilter==='a'?'active-a':''}"   data-filter="a"   title="Filtrar: somente rating A"><span class="dot dot-green"></span>${countA} com rating A</div>
            ${countB > 0 ? `<div class="stat-pill ${activeRatingFilter==='b'?'active-b':''}" data-filter="b" title="Filtrar: somente rating B"><span class="dot dot-blue"></span>${countB} com rating B</div>` : ''}
            ${countC > 0 ? `<div class="stat-pill ${activeRatingFilter==='c'?'active-c':''}" data-filter="c" title="Filtrar: somente rating C"><span class="dot dot-amber"></span>${countC} com rating C</div>` : ''}
            ${countD > 0 ? `<div class="stat-pill ${activeRatingFilter==='d'?'active-d':''}" data-filter="d" title="Filtrar: somente rating D"><span class="dot dot-red"></span>${countD} com rating D</div>` : ''}
        `;
        const ratingLabels = { a: 'A', b: 'B', c: 'C', d: 'D' };

                if (lbl) {

                    lbl.style.color = ratingColors[activeRatingFilter] || 'var(--text3)';
                }
                updateStats(); // re-render pills with new active state
                // Re-run current search with new filter
                const term = searchInput ? searchInput.value.trim() : '';
                if (term.length >= 2) {
                    searchInput.dispatchEvent(new Event('input'));
                } else {
                    renderDetalhes(null);
                }

                // Clicar em um pill (A/B/C/D/todos) já abre a lista filtrada correspondente,
                // reaproveitando o mesmo botão e função do "Ver todos".
                listVisible = true;
                const btnVerTodos = document.getElementById('verTodosBtn');
                if (btnVerTodos) { btnVerTodos.classList.add('active'); btnVerTodos.textContent = '✕ Fechar lista'; }
                renderListaItems();
            });
        });
    }
    function rebuildMap() { instMap.clear(); instituicoes.forEach(inst => instMap.set(inst['Instituição'], inst)); }
    function setupAutocomplete() {
        searchInput = document.getElementById('searchInput');
        autocompleteDiv = document.getElementById('autocompleteList');
        clearBtn = document.getElementById('clearSearchBtn');
        
        function toggleClearBtn() { clearBtn.style.display = searchInput.value.length > 0 ? 'flex' : 'none'; }
        searchInput.addEventListener('input', toggleClearBtn);
        clearBtn.addEventListener('click', () => { searchInput.value = ''; autocompleteDiv.style.display = 'none'; renderDetalhes(null); toggleClearBtn(); searchInput.focus(); currentFocus = -1; });
        
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim();
            if (term.length < 2) { autocompleteDiv.style.display = 'none'; renderDetalhes(null); currentFocus = -1; return; }
            const termLower = term.toLowerCase();
            const matches = instituicoes.filter(inst => {
                if (!inst['Instituição'].toLowerCase().includes(termLower)) return false;
                return matchesRatingFilter(inst);
            });
            if (matches.length === 0) { autocompleteDiv.style.display = 'none'; renderDetalhes(null); currentFocus = -1; return; }
            autocompleteDiv.innerHTML = '';
            matches.slice(0, 50).forEach((inst, idx) => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.setAttribute('data-index', idx);
                const ratingClass = getRatingColorClass(inst['Rating']);
                div.innerHTML = `<span>${escapeHtml(inst['Instituição'])}</span><span class="rating-badge ${ratingClass}">${escapeHtml(inst['Rating'] || 'NR')}</span>`;
                div.addEventListener('click', () => {
                    searchInput.value = inst['Instituição'];
                    autocompleteDiv.style.display = 'none';
                    renderDetalhes(inst);
                    toggleClearBtn();
                    currentFocus = -1;
                });
                autocompleteDiv.appendChild(div);
            });
            autocompleteDiv.style.display = 'block';
            currentFocus = -1;
        });
        
        searchInput.addEventListener('keydown', (e) => {
            const items = autocompleteDiv.querySelectorAll('.autocomplete-item');
            if (items.length === 0) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentFocus++;
                if (currentFocus >= items.length) currentFocus = 0;
                updateActiveItem(items, currentFocus);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentFocus--;
                if (currentFocus < 0) currentFocus = items.length - 1;
                updateActiveItem(items, currentFocus);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (currentFocus >= 0 && currentFocus < items.length) items[currentFocus].click();
                else if (autocompleteDiv.style.display === 'block' && items.length > 0) items[0].click();
                else {
                    const term = searchInput.value.trim();
                    if (term.length > 0) {
                        const exactMatch = instituicoes.find(inst => inst['Instituição'].toLowerCase() === term.toLowerCase());
                        if (exactMatch) { renderDetalhes(exactMatch); searchInput.value = exactMatch['Instituição']; toggleClearBtn(); }
                        else {
                            const similar = instituicoes.find(inst => inst['Instituição'].toLowerCase().includes(term.toLowerCase()));
                            if (similar) { renderDetalhes(similar); searchInput.value = similar['Instituição']; toggleClearBtn(); }
                        }
                    }
                }
                autocompleteDiv.style.display = 'none';
                currentFocus = -1;
            }
        });
        
        function updateActiveItem(items, focusIndex) {
            items.forEach((item, idx) => {
                if (idx === focusIndex) { item.classList.add('active'); item.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
                else item.classList.remove('active');
            });
        }
        
        document.addEventListener('click', (e) => { if (e.target !== searchInput && !autocompleteDiv.contains(e.target)) { autocompleteDiv.style.display = 'none'; currentFocus = -1; } });
        toggleClearBtn();
    }
    function normalizarTexto(str) { return str.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }
    function encontrarColunas(headers) {
        const map = {
            Instituição: ['instituicao','instituição','nome','banco','empresa'],
            Seg: ['seg','segmento','categoria'],
            Rating: ['rating','classificacao','nota'],
            'Peso Sug.': ['peso sug','peso sugerido','peso','sugerido'],
            'Score Final': ['score final','score','pontuacao final','nota final'],
            Basileia: ['basileia','capital'],
            'NPL (15d)': ['npl','inadimplencia','15d'],
            ROE: ['roe','retorno patrimonio'],
            LDR: ['ldr','liquidez'],
            'IRBB/PR': ['irbb','pr','irbb/pr']
        };
        let indices = {};
        for (let campo in map) indices[campo] = -1;
        for (let i=0; i<headers.length; i++) {
            let h = normalizarTexto(headers[i]);
            for (let [campo, chaves] of Object.entries(map)) {
                if (indices[campo] === -1 && chaves.some(c => h.includes(c))) indices[campo] = i;
            }
        }
        return indices;
    }
    async function processarExcelParaGerarHTML(file) {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        let sheetName = 'Planilha1';
        if (!workbook.Sheets[sheetName]) sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rows || rows.length < 2) throw new Error('Planilha vazia');
        const headers = rows[0].map(c => c ? c.toString().trim() : '');
        const colIndex = encontrarColunas(headers);
        if (colIndex.Instituição === -1) throw new Error('Coluna "Instituição" não identificada.');
        const novasInst = [];
        for (let i=1; i<rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;
            const nome = row[colIndex.Instituição]?.toString().trim();
            if (!nome) continue;
            let obj = { 'Instituição': nome };
            if (colIndex.Seg !== -1) obj.Seg = row[colIndex.Seg]?.toString() || '';
            if (colIndex.Rating !== -1) obj.Rating = row[colIndex.Rating]?.toString() || '';
            if (colIndex['Peso Sug.'] !== -1) obj['Peso Sug.'] = parseFloat(row[colIndex['Peso Sug.']]);
            if (colIndex['Score Final'] !== -1) obj['Score Final'] = parseFloat(row[colIndex['Score Final']]);
            if (colIndex.Basileia !== -1) obj.Basileia = parseFloat(row[colIndex.Basileia]);
            if (colIndex['NPL (15d)'] !== -1) obj['NPL (15d)'] = parseFloat(row[colIndex['NPL (15d)']]);
            if (colIndex.ROE !== -1) obj.ROE = parseFloat(row[colIndex.ROE]);
            if (colIndex.LDR !== -1) obj.LDR = parseFloat(row[colIndex.LDR]);
            if (colIndex['IRBB/PR'] !== -1) obj['IRBB/PR'] = parseFloat(row[colIndex['IRBB/PR']]);
            novasInst.push(obj);
        }
        if (novasInst.length === 0) throw new Error('Nenhuma instituição válida');
        
        // Gerar o novo HTML com os dados atualizados (mesmo template, mas com o array substituído)
        const novoHTML = await gerarHTMLComDados(novasInst);
        const blob = new Blob([novoHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'buscador_atualizado.html';
        a.click();
        URL.revokeObjectURL(url);
        alert('Novo HTML gerado com ' + novasInst.length + ' instituições. Substitua o arquivo no servidor.');
    }
    function gerarHTMLComDados(dados) {
        // Serializa os novos dados
        const linhas = dados.map(inst => {
            const campos = Object.entries(inst).map(([k, v]) => {
                const val = (typeof v === 'string') ? JSON.stringify(v) : (isNaN(v) ? JSON.stringify(v) : v);
                return '        ' + JSON.stringify(k) + ': ' + val;
            });
            return '    {\n' + campos.join(',\n') + '\n    }';
        }).join(',\n');
        const novoArray = 'let instituicoes = [\n' + linhas + '\n    ];';

        // Usa fetch para pegar o fonte original da página (sem reformatação do browser)
        return fetch(location.href)
            .then(r => r.text())
            .then(fonte => {
                const INICIO = 'let instituicoes = [';
                const FIM    = '];\n    let instMap';
                const i1 = fonte.indexOf(INICIO);
                const i2 = fonte.indexOf(FIM, i1);
                if (i1 === -1 || i2 === -1) throw new Error('Marcadores de dados não encontrados no fonte.');
                // Stampa data/hora da atualização no meta tag
                const agora = new Date().toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
                let resultado = fonte.slice(0, i1) + novoArray + '\n    let instMap' + fonte.slice(i2 + FIM.length);
                resultado = resultado.replace(/<meta name="data-atualizacao" content="[^"]*">/, '<meta name="data-atualizacao" content="' + agora + '">');
                return resultado;
            });
    }

    // ── Ver todos ──
    function renderListaItems() {
        const listCard = document.getElementById('listCard');
        let items = [...instituicoes];
        items = items.filter(matchesRatingFilter);

        listCard.innerHTML = `
            <div class="fundos-list-header">
                <h2>${items.length} instituição${items.length!==1?'ões':''}</h2>
                <div style="display:flex;gap:8px;align-items:center;">
                    <button id="limparListaBtn" style="background:transparent;border:1px solid var(--border);border-radius:8px;padding:4px 12px;font-size:.72rem;font-weight:600;color:var(--text3);cursor:pointer;font-family:inherit;" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text3)'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg> Limpar seleção</button>
                    <span style="font-size:.75rem;color:var(--text3);">▼ para expandir</span>
                </div>
            </div>
            <div id="fundosList">
                ${items.map(inst => {
                    const rClass = getRatingColorClass(inst['Rating']);
                    const badge  = inst['Rating'] ? `<span class="rating-badge ${rClass}">${escapeHtml(inst['Rating'])}</span>` : '';
                    const pct = v => (v !== undefined && v !== '' && v !== null) ? (parseFloat(v)*100).toFixed(2)+'%' : '—';
                    const num = v => (v !== undefined && v !== '' && v !== null) ? Number(v).toLocaleString('pt-BR',{maximumFractionDigits:0}) : '—';
                    const campos = [
                        { label:'Segmento',      val: inst['Seg']          || '—' },
                        { label:'Peso Sugerido', val: pct(inst['Peso Sug.'])       },
                        { label:'Score Final',   val: num(inst['Score Final'])     },
                        { label:'Basileia',      val: pct(inst['Basileia'])        },
                        { label:'NPL (15d)',     val: pct(inst['NPL (15d)'])       },
                        { label:'ROE',           val: pct(inst['ROE'])             },
                        { label:'LDR',           val: pct(inst['LDR'])             },
                        { label:'IRBB/PR',       val: pct(inst['IRBB/PR'])         },
                    ];
                    const detailGrid = campos.filter(cp => cp.val && cp.val !== '—').map(cp =>
                        `<div class="fundo-detail-item"><div class="fundo-detail-label">${cp.label}</div><div class="fundo-detail-value">${escapeHtml(cp.val)}</div></div>`
                    ).join('');
                    return `
                    <div class="fundo-item-wrap" data-nome="${escapeHtml(inst['Instituição'])}">
                        <div class="fundo-item">
                            <span class="fundo-item-name" title="${escapeHtml(inst['Instituição'])}">${escapeHtml(inst['Instituição'])}</span>
                            <div class="fundo-item-meta">
                                <span class="fundo-item-cat">${escapeHtml(inst['Seg']||'')}</span>
                                ${badge}
                                <span class="fundo-item-arrow">▼</span>
                            </div>
                        </div>
                        <div class="fundo-detail-panel">
                            <div class="fundo-detail-grid">${detailGrid}</div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        `;
        document.getElementById('listArea').style.display = 'block';

        listCard.querySelectorAll('.fundo-item-wrap').forEach(wrap => {
            wrap.querySelector('.fundo-item').addEventListener('click', () => {
                const isOpen = wrap.classList.contains('open');
                listCard.querySelectorAll('.fundo-item-wrap.open').forEach(el => {
                    el.classList.remove('open');
                    el.querySelector('.fundo-detail-panel').classList.remove('open');
                });
                if (!isOpen) {
                    wrap.classList.add('open');
                    wrap.querySelector('.fundo-detail-panel').classList.add('open');
                    wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
                }
            });
        });

        const limparBtn = document.getElementById('limparListaBtn');
        if (limparBtn) limparBtn.addEventListener('click', () => {
            listCard.querySelectorAll('.fundo-item-wrap.open').forEach(el => {
                el.classList.remove('open');
                el.querySelector('.fundo-detail-panel').classList.remove('open');
            });
        });
    }

    let listVisible = false;
    document.getElementById('verTodosBtn').addEventListener('click', () => {
        listVisible = !listVisible;
        const btn = document.getElementById('verTodosBtn');
        if (listVisible) {
            btn.classList.add('active');
            btn.textContent = '✕ Fechar lista';
            renderListaItems();
        } else {
            btn.classList.remove('active');
            btn.textContent = 'Ver todos';
            document.getElementById('listArea').style.display = 'none';
        }
    });

    // ── Data de atualização ──
    (function() {
        const meta = document.querySelector('meta[name="data-atualizacao"]');
        const span = document.getElementById('dataAtualizacao');
        if (meta && meta.content && span) {
            span.textContent = '· Atualizado em ' + meta.content;
        }
    })();

    // ── Relógio da topbar ──
    function updateHubClock() {
        const el = document.getElementById('hubClock');
        if (!el) return;
        const now = new Date();
        el.textContent = now.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short', year:'numeric'})
            + ' · ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    }
    updateHubClock();
    setInterval(updateHubClock, 1000);

    // ── Tema (integrado com hubThemeBtn) ──
    function initHubTheme() {
        const savedTheme = localStorage.getItem('theme');
        const btnTheme = document.getElementById('hubThemeBtn');
        if (savedTheme === 'light') {
            document.body.classList.add('light');
        } else {
            document.body.classList.remove('light');
        }
        if(btnTheme) {
            btnTheme.addEventListener('click', () => {
                if (document.body.classList.contains('light')) {
                    document.body.classList.remove('light');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.add('light');
                    localStorage.setItem('theme', 'light');
                }
            });
        }
    }
    initHubTheme();

    // ── Navegação da topbar ──
    document.getElementById('hubBackBtn')?.addEventListener('click', () => {
        if (window.self !== window.top) {
            window.parent.postMessage({ action: 'hubNavigate', target: 'home' }, '*');
        } else {
            window.location.href = "https://pabloads2020-lang.github.io/Dashboard-Ferramentas-Integradas/dashboard.html";
        }
    });
    document.getElementById('hubNewTabBtn')?.addEventListener('click', () => {
        window.open(window.location.href, '_blank');
    });

    // Inicialização dos dados
    rebuildMap();
    updateStats();
    setupAutocomplete();
    const adminBtn = document.getElementById('adminBtn');
    const modal = document.getElementById('adminModal');
    const cancelBtn = document.getElementById('cancelModalBtn');
    const adminPass = document.getElementById('adminPassword');
    const uploadAreaModal = document.getElementById('uploadAreaModal');
    const adminFileInput = document.getElementById('adminFileInput');
    adminBtn.addEventListener('click', () => { modal.style.display = 'flex'; adminPass.value = ''; uploadAreaModal.style.display = 'block'; adminFileInput.value = ''; });
    cancelBtn.addEventListener('click', () => { modal.style.display = 'none'; });
    adminPass.addEventListener('input', (e) => { if (e.target.value === ADMIN_SENHA) uploadAreaModal.style.display = 'block'; else uploadAreaModal.style.display = 'none'; });
    uploadAreaModal.addEventListener('click', () => { if (adminPass.value === ADMIN_SENHA) adminFileInput.click(); });
    adminFileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (adminPass.value !== ADMIN_SENHA) { alert('Senha incorreta.'); adminFileInput.value = ''; return; }
        try {
            await processarExcelParaGerarHTML(file);
            modal.style.display = 'none';
        } catch (err) { alert('Erro: '+err.message); }
    });

</script>
